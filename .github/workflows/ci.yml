# GitHub Actions CI for AIQuotaPilot (KDE Plasma 6 widget)
#
# What this runs:
#   - cmake configure + build (the production target)
#   - ctest (C++ unit/contract tests)
#   - tests/run-static-checks.sh (QML component tests, qmllint, metadata,
#     AppStream, native-chart-gate)
#
# Trigger policy:
#   - push / pull_request to master
#   - manual dispatch via the Actions tab
#
# Image choice:
#   - KDE neon — official KDE CI image with Plasma 6 + Qt 6 + KF6 pre-installed.
#     Avoids the long apt-get install chain of stock Ubuntu.
#
# The workflow is intentionally a "no-restart" job: it builds and tests
# only, mirroring what a human does locally via tests/run-static-checks.sh
# before pushing. The plasma-local-deploy skill (post-merge deploy to
# the user's desktop) is NOT invoked here — that requires explicit user
# confirmation per AGENTS.md.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    container:
      # KDE neon 的「官方」CI 镜像不再公共匿名可拉取（invent-registry.kde.org
      # 需认证，kdeci/neon 已废弃）。改用 Ubuntu 24.04 官方包提供
      # Qt 6.6 / KF6 / Plasma 6.0 —— 与本地开发环境（Manjaro/Qt 6.11）
      # 存在版本差，但覆盖构建 + C++ 契约测试 + QML 组件测试足够。
      image: ubuntu:24.04
    defaults:
      run:
        # ubuntu:24.04 容器默认 shell 是 dash（不支持 pipefail / 数组语法），
        # 统一显式用 bash。
        shell: bash
    env:
      # mirror of tests/run-static-checks.sh expectations
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host build dependencies
        # Ubuntu 24.04 官方仓库没有 KF6/Plasma 6 包（Plasma 6 需要
        # Kubuntu Backports PPA）。容器内默认以 root 运行，无需 sudo。
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common ca-certificates
          add-apt-repository -y ppa:kubuntu-ppa/backports
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            extra-cmake-modules \
            gettext \
            kpackagetool6 \
            kf6-kcmutils \
            libkf6wallet-dev \
            libkf6config-dev \
            libkf6coreaddons-dev \
            libkirigami6 \
            libkirigamigallery-dev \
            libplasma6-dev \
            libqt6core6 \
            libqt6qml6 \
            libqt6quickcharts6 \
            plasma-workspace \
            qml6-module-* \
            qml6-module-org-kde-* \
            qmltestrunner-qt6 \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            ripgrep \
            xmllint

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DBUILD_TESTING=ON

      - name: Build
        # The whole tree (not just org.kde.plasma.AIQuotaPilot) so the
        # test executables under tests/cpp/ also link.
        run: cmake --build build -j"$(nproc)"

      - name: C++ tests (ctest)
        run: |
          set -euo pipefail
          cd build
          ctest --output-on-failure

      - name: QML + static checks
        # run-static-checks.sh expects rg, xmllint, python3 and a Qt6
        # QML test runner — installed above on the Ubuntu container.
        run: bash tests/run-static-checks.sh

      - name: Build summary
        if: failure()
        run: |
          echo "::group::CMake configure log"
          cat build/CMakeFiles/CMakeOutput.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload ctest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary
          if-no-files-found: ignore
