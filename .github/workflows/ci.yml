# GitHub Actions CI for AIQuotaPilot (KDE Plasma 6 widget)
#
# What this runs:
#   - cmake configure + build (the production target)
#   - ctest (C++ unit/contract tests)
#   - tests/run-static-checks.sh (QML component tests, qmllint, metadata,
#     AppStream, native-chart-gate)
#
# Trigger policy:
#   - push / pull_request to master
#   - manual dispatch via the Actions tab
#
# Image choice:
#   - Arch Linux (container: archlinux:latest) — the only public, anonymously
#     pullable image that ships the full Plasma 6 + KF6 + Qt 6 dev stack.
#     KDE neon's official CI images (invent-registry.kde.org) require auth;
#     Ubuntu 24.04/Kubuntu PPA do not ship libplasma6-dev in any public repo.
#     Arch packages the tools where the project expects them (qmllint and
#     qmltestrunner live inside qt6-declarative).
#
# The workflow is intentionally a "no-restart" job: it builds and tests
# only, mirroring what a human does locally via tests/run-static-checks.sh
# before pushing. The plasma-local-deploy skill (post-merge deploy to
# the user's desktop) is NOT invoked here — that requires explicit user
# confirmation per AGENTS.md.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    defaults:
      run:
        # Arch 容器默认 shell 是 bash（与 runner 一致；显式声明防回归）。
        shell: bash
    env:
      # pacman 非交互：装包时不问确认/默认值。
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        # Arch 官方 extra/community 仓库提供完整 KF6 + Plasma 6 开发栈；
        # qmllint / qmltestrunner 在 qt6-declarative 内（与本地 Manjaro 一致）。
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel \
            cmake \
            extra-cmake-modules \
            gettext \
            git \
            kcmutils \
            kconfig \
            kcoreaddons \
            kirigami \
            kpackage \
            kwallet \
            libplasma \
            plasma-workspace \
            qt6-base \
            qt6-declarative \
            qt6-tools \
            qt6-websockets \
            ripgrep \
            python \
            libxml2

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DBUILD_TESTING=ON

      - name: Build
        # The whole tree (not just org.kde.plasma.AIQuotaPilot) so the
        # test executables under tests/cpp/ also link.
        run: cmake --build build -j"$(nproc)"

      - name: C++ tests (ctest)
        run: |
          set -euo pipefail
          cd build
          ctest --output-on-failure

      - name: QML + static checks
        # run-static-checks.sh expects rg, xmllint, python3 and a Qt6
        # QML test runner — installed above on the Arch container.
        run: bash tests/run-static-checks.sh

      - name: Build summary
        if: failure()
        run: |
          echo "::group::CMake configure log"
          cat build/CMakeFiles/CMakeOutput.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload ctest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary
          if-no-files-found: ignore
